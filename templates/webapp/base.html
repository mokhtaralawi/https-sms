{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}بوابة الرسائل{% endblock %}</title>
<style>
  :root{
    --brand:#1565c0; --brand-dark:#0d47a1; --bg:#f1f5f9;
    --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --border:#e2e8f0; --danger:#dc2626; --success:#16a34a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--brand);text-decoration:none}
  .topbar{background:var(--brand);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .topbar .logo{font-weight:700;font-size:18px}
  .topbar a{color:#fff;margin-inline-start:16px}
  .wrap{max-width:440px;margin:48px auto;padding:0 16px}
  .wrap.wide{max-width:820px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  label{display:block;font-size:13px;margin:14px 0 6px;color:var(--text)}
  input[type=text],input[type=email],input[type=password],input[type=number]{
    width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;font-size:15px;background:#fff}
  input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  .btn{display:inline-block;width:100%;padding:13px;border:none;border-radius:9px;background:var(--brand);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:18px}
  .btn:hover{background:var(--brand-dark)}
  .btn.secondary{background:#e2e8f0;color:var(--text);margin-top:10px}
  .btn.google{background:#fff;color:#1e293b;border:1px solid var(--border)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msgs{margin:16px 0}
  .msg{padding:10px 14px;border-radius:8px;margin:6px 0;font-size:14px}
  .msg.err{background:#fee2e2;color:var(--danger)}
  .msg.ok{background:#dcfce7;color:var(--success)}
  .msg.info{background:#e0f2fe;color:#0369a1}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .oauth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:13px}
  .oauth-divider::before,.oauth-divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .google-icon{font-weight:700;display:inline-block;margin-inline-end:8px}
  .keybox{background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:12px;font-family:monospace;
    font-size:13px;word-break:break-all;direction:ltr;text-align:left}
  .table{width:100%;border-collapse:collapse;margin-top:14px}
  .table th,.table td{border:1px solid var(--border);padding:10px;text-align:right;font-size:14px}
  .table th{background:#f8fafc}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .badge.on{background:#dcfce7;color:var(--success)}
  .badge.off{background:#fee2e2;color:var(--danger)}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">📡 بوابة الرسائل SMS</span>
    {% if user.is_authenticated %}
      <span><a href="{% url 'webapp:logout' %}">تسجيل الخروج</a></span>
    {% endif %}
  </div>

  {% if messages %}
  <div class="wrap msgs">
    {% for m in messages %}
      <div class="msg {{ m.tags }}">{{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
  <div class="footer">بوابة الرسائل SMS — منصة استضافة ذاتية</div>
</body>
</html>
