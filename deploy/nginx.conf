# HttpSMS - nginx reverse proxy
# Serves static files and proxies HTTP + WebSocket to daphne on 127.0.0.1:8000.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/httpsms
#           sudo ln -s /etc/nginx/sites-available/httpsms /etc/nginx/sites-enabled/
# Replace YOUR_DOMAIN with the real domain (or use the listen 80 server for HTTP).
# TLS: run `sudo certbot --nginx -d YOUR_DOMAIN` after the site is active.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # Managed by certbot:
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /static/ {
        alias /srv/http_sms/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (Android gateway devices connect to /ws/device/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}